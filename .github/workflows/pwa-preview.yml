name: PWA isolated preview and Chromium QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'launcher/assets/pwa-workspace.*'
      - 'launcher/assets/pwa-themes.css'
      - 'launcher/assets/pwa-guides.js'
      - 'launcher/assets/pwa-atlas-bridge.js'
      - 'launcher/assets/pwa-atlas-themes.css'
      - 'launcher/assets/app.js'
      - 'cloudflare/worker.js'
      - 'cloudflare/link-preview.js'
      - 'tests/link_preview_worker.test.mjs'
      - 'docs/pwa-*'
      - 'scripts/pwa_preview_qa.mjs'
      - 'scripts/build_pwa_atlas_preview.py'
      - '.github/workflows/pwa-preview.yml'
permissions:
  contents: read
concurrency:
  group: hipster-go-pwa-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview-qa:
    # Only this repository's own parity branch, never external fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'feat/pwa-') || startsWith(github.head_ref, 'feature/pwa-')) || startsWith(github.head_ref, 'fix/inspiration-metadata-') || startsWith(github.head_ref, 'feat/compact-skill-first-'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check unchanged gig-poster edition
        run: |
          python scripts/build_gig_poster.py
          git diff --exit-code -- launcher/editions/gig-poster
          python -m unittest discover -s tests -v
          node --check launcher/assets/pwa-workspace.js
          node --check launcher/assets/pwa-guides.js
          node --check launcher/assets/pwa-atlas-bridge.js
          node --check launcher/assets/app.js
          node --check cloudflare/link-preview.js
          node --test tests/link_preview_worker.test.mjs
          node --check scripts/pwa_preview_qa.mjs
      - name: Verify preview deploy authorization
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CF_TOKEN" || { echo "::error::Missing Cloudflare deploy token"; exit 1; }
      - name: Stamp exact preview revision
        run: sed -i "s/__GITHUB_SHA__/${GITHUB_SHA}/g" wrangler.toml
      - name: Package canonical Android 0.9.56 Atlas in an isolated browser path
        run: |
          python scripts/build_pwa_atlas_preview.py
          test -s launcher/pwa-atlas/index.html
          test -s launcher/pwa-atlas/assets/maplibre/maplibre-gl.js
          test -s launcher/pwa-atlas/assets/cahill-keyes-vendor.js
          test -s launcher/pwa-atlas/assets/pwa-atlas-bridge.js
          test -s launcher/pwa-atlas/assets/pwa-atlas-themes.css
      - name: Deploy the isolated preview Worker, never production
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.156.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 47b318c510ebbdc3a45ddeafeda4a18f
          command: deploy --name hipster-go-pwa-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployed preview in Chromium
        env:
          PWA_PREVIEW_URL: https://hipster-go-pwa-preview.samelling.workers.dev
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/pwa_preview_qa.mjs
      - name: Keep preview QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-preview-qa-${{ github.event.pull_request.number }}
          path: artifacts/pwa-preview
          if-no-files-found: warn
