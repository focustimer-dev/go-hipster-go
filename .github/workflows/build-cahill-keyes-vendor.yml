name: Prepare offline Cahill-Keyes D3 vendor
on:
  push:
    branches: [experiment/lab-0-9-47-cahill-keyes]
    paths:
      - 'android-lab/web/cahill-keyes-entry.js'
      - 'scripts/build_cahill_keyes_vendor.sh'
      - '.github/workflows/build-cahill-keyes-vendor.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/lab-0-9-47-cahill-keyes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle pinned D3 projection for offline Lab
        run: bash scripts/build_cahill_keyes_vendor.sh
      - name: Commit only the generated offline vendor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-lab/web/cahill-keyes-vendor.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Android Lab: vendor offline Cahill-Keyes projection library'
          git push origin HEAD:experiment/lab-0-9-47-cahill-keyes
