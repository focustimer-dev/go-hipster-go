name: Publish portable skill ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/build_gemini_app_skill.py'
      - 'scripts/build_agent_packages.py'
      - 'plugin.json'
      - '.claude-plugin/**'
      - 'skills/setup/**'
      - 'adapters/streaming/**'
      - 'schemas/**'
      - 'scripts/playlist_cli.py'
      - '.github/workflows/publish-gemini-skill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-skill-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Claude and Gemini packages from canonical sources
        run: python scripts/build_agent_packages.py --zip
      - name: Validate upload structures
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path=Path('dist/hipster-music-generator-gemini-app-skill.zip')
          assert path.is_file()
          with ZipFile(path) as z:
              assert z.namelist() == [
                  'SKILL.md',
                  'references/global-scenes.md',
                  'references/sonic-taxonomy.md',
                  'references/curation-examples.md',
                  'references/verification.md',
              ]
              text=z.read('SKILL.md').decode('utf-8')
              assert '## The personality is mandatory in Gemini' in text
              assert 'DeBarge Protocol' in text and '25 consecutive' in text
              assert 'scripts/' not in text and 'python ' not in text.lower()
          claude=Path('dist/hipster-music-generator-claude-skill.zip')
          plugin=Path('dist/hipster-music-generator-claude-plugin.zip')
          assert claude.is_file() and plugin.is_file()
          with ZipFile(claude) as z:
              assert 'hipster-music-generator/SKILL.md' in z.namelist()
              assert 'hipster-music-generator/references/global-scenes.md' in z.namelist()
              front=z.read('hipster-music-generator/SKILL.md').decode('utf-8')
              desc=next(line[len('description: '):] for line in front.splitlines() if line.startswith('description: '))
              assert len(desc) <= 200, 'Claude frontmatter description too long'
          with ZipFile(plugin) as z:
              assert '.claude-plugin/plugin.json' in z.namelist()
              assert 'skills/setup/SKILL.md' in z.namelist()
              assert 'skills/hipster-music-generator/SKILL.md' in z.namelist()
          print('Gemini and Claude skill/plugin ZIPs verified.')
          PY
      - name: Determine versioned release tag
        id: version
        run: |
          version=$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')
          echo "tag=gemini-skill-v${version}" >> "$GITHUB_OUTPUT"
      - name: Publish verified platform ZIPs as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          files=(
            dist/hipster-music-generator-gemini-app-skill.zip
            dist/hipster-music-generator-claude-skill.zip
            dist/hipster-music-generator-claude-plugin.zip
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Hipster Music Generator platform packages (${RELEASE_TAG})" \
              --notes 'Ready-to-upload Gemini Skill, Claude Skill and Claude Plugin ZIPs; each requires the music-service authorization separately.' \
              --latest
          fi
          gh release view "$RELEASE_TAG" --json url,assets
