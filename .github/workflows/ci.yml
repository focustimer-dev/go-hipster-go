name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify files and examples
        run: |
          python scripts/playlist_cli.py check-skill
          python scripts/build_agent_packages.py --check
          python scripts/build_agent_packages.py --zip
          python scripts/playlist_cli.py validate examples/example-playlist.json
          python -m unittest discover -s tests -v
