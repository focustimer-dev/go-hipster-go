name: Android Lab 0.9.48 Cahill-Keyes Preview (build only)
on:
  push:
    branches: [experiment/lab-0-9-47-cahill-keyes]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m pip install Pillow==12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_cahill_keyes_math.cjs
      - run: python -m unittest discover -s android-lab/tests -v
      - run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - name: Validate normal Lab identity
        run: |
          set -euo pipefail
          apk=android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='57' versionName='0.9.48'"* ]] || {
            echo '::error::Wrong Lab package or version';exit 1;
          }
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install chromium
      - name: Real M-shaped projection, selection and switch QA
        run: node scripts/test_atlas_cahill_keyes.cjs
      - name: Preserve Robinson / Globe interpolation QA
        run: node scripts/test_atlas_vector_transition.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.48-cahill-keyes-unsigned
          path: |
            android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
            android-lab/build/switch-review/cahill-keyes-320.png
          if-no-files-found: error
          retention-days: 7
