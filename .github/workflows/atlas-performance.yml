name: Atlas performance comparison
on:
  pull_request:
    paths:
      - 'launcher/assets/app.js'
      - 'scripts/profile_atlas.cjs'
      - '.github/workflows/atlas-performance.yml'
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: |
          git worktree add --detach /tmp/atlas-baseline 16a0f59a1a3d6834e09c150fd9906b638d3326f5
          python /tmp/atlas-baseline/scripts/bundle_android_lab.py
          python scripts/bundle_android_lab.py
          mkdir -p android-lab/build/atlas-perf
          node scripts/profile_atlas.cjs /tmp/atlas-baseline/android-lab/app/src/main/assets/site android-lab/app/src/main/assets/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-performance
          path: android-lab/build/atlas-perf/
