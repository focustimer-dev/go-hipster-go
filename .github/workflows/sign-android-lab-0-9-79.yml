name: Sign verified Android Lab 0.9.79 APK

# Manually triggered only. Signs one exact CI-verified APK using existing GitHub Secrets.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sign-verified-android-lab-0-9-79
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Do not check out or execute the experimental Android branch in this signing job.
      # Only download the release binary produced by its already-successful isolated CI job.
      - name: Verify the exact successful Lab build and download its unsigned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=43522303397
          expected_sha=150e6a986546c6f49a11230f88f16bd01e88d5aa
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
          test "$actual_sha" = "$expected_sha" || { echo "::error::Lab build commit differs from the reviewed one"; exit 1; }
          test "$conclusion" = success || { echo "::error::Lab CI did not succeed"; exit 1; }
          mkdir unsigned
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name hipster-go-lab-unsigned-apk --dir unsigned
          test -s unsigned/app-release-unsigned.apk
          sha256sum unsigned/app-release-unsigned.apk

      - name: Check package identity and align
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "::error::Runner Android SDK is unavailable"; exit 1; }
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign" && test -x "$build_tools/apksigner" && test -x "$build_tools/aapt"
          badging="$("$build_tools/aapt" dump badging unsigned/app-release-unsigned.apk)"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='89' versionName='0.9.79'"* ]] ||
            { echo "::error::Unexpected Android package ID or version; refusing to sign"; exit 1; }
          "$build_tools/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/lab-aligned.apk"
          "$build_tools/zipalign" -c 4 "$RUNNER_TEMP/lab-aligned.apk"
          echo "LAB_ANDROID_BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"

      - name: Sign with the original private Lab keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$ANDROID_KEYSTORE_PASSWORD" ||
            { echo "::error::Configure HIPSTER_ANDROID_KEYSTORE_B64 and HIPSTER_ANDROID_KEYSTORE_PASSWORD in repository Actions secrets"; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/hipster-go-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          sign_args=(--ks "$keystore" --ks-key-alias hipster-go --ks-pass env:ANDROID_KEYSTORE_PASSWORD)
          if [[ -n "$ANDROID_KEY_PASSWORD" ]]; then
            sign_args+=(--key-pass env:ANDROID_KEY_PASSWORD)
          fi
          "$LAB_ANDROID_BUILD_TOOLS/apksigner" sign "${sign_args[@]}" \
            --out Hipster-GO-Lab-0.9.79.apk "$RUNNER_TEMP/lab-aligned.apk"
          "$LAB_ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs Hipster-GO-Lab-0.9.79.apk
          cert_details="$("$LAB_ANDROID_BUILD_TOOLS/apksigner" verify --print-certs Hipster-GO-Lab-0.9.79.apk)"
          [[ "$cert_details" == *"Signer #1 certificate SHA-256 digest: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0"* ]] ||
            { echo "::error::Signer differs from the established Android Lab identity"; exit 1; }
          sha256sum Hipster-GO-Lab-0.9.79.apk

      - name: Publish signed APK (not the keystore)
        uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.79-signed-apk
          path: Hipster-GO-Lab-0.9.79.apk
          if-no-files-found: error
          retention-days: 7
