name: Android Lab 0.9.67 Final Five signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sign-android-lab-0-9-67.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lab-0-9-67-final-five-signing
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Build the merged canonical Android source
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python -m pip install Pillow==12.0.0
          bash android/gradlew -p android-lab assembleRelease --no-daemon
      - name: Verify exact package and version, then align
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="android-lab/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          badging="$("$tools/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='76' versionName='0.9.67'"* ]] || {
            echo "::error::Unexpected package/version; release aborted"
            exit 1
          }
          "$tools/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/lab-aligned.apk"
          "$tools/zipalign" -c 4 "$RUNNER_TEMP/lab-aligned.apk"
      - name: Sign with the existing private Android Lab certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Original Android Lab signing secrets are unavailable; cannot issue an in-place update"
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/hipster-go-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          args=(--ks "$keystore" --ks-key-alias hipster-go --ks-pass env:ANDROID_KEYSTORE_PASSWORD)
          if [[ -n "${ANDROID_KEY_PASSWORD:-}" ]]; then args+=(--key-pass env:ANDROID_KEY_PASSWORD); fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign "${args[@]}" \
            --out Hipster-GO-Lab-0.9.67-Final-Five-signed.apk "$RUNNER_TEMP/lab-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs Hipster-GO-Lab-0.9.67-Final-Five-signed.apk
          cert="$("$tools/apksigner" verify --print-certs Hipster-GO-Lab-0.9.67-Final-Five-signed.apk)"
          [[ "$cert" == *"Signer #1 certificate SHA-256 digest: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0"* ]] || {
            echo "::error::Wrong signer: would not upgrade installed 0.9.66"
            exit 1
          }
          "$tools/zipalign" -c 4 Hipster-GO-Lab-0.9.67-Final-Five-signed.apk
          sha256sum Hipster-GO-Lab-0.9.67-Final-Five-signed.apk
          printf 'Version: 0.9.67 (code 76)\nSource commit: %s\nPackage: work.samelling.hipstergo.lab\nCertificate SHA256: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0\n' "$GITHUB_SHA" > Hipster-GO-Lab-0.9.67-release-info.txt
      - name: Upload installable APK (never the signing key)
        uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.67-final-five-signed-apk
          path: |
            Hipster-GO-Lab-0.9.67-Final-Five-signed.apk
            Hipster-GO-Lab-0.9.67-release-info.txt
          retention-days: 7
          if-no-files-found: error
