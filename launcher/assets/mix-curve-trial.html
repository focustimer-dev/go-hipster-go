ng:12px;background:var(--receipt);margin-top:6px}.export code{overflow-wrap:anywhere}.export button{margin-top:8px}.axis{gap:8px}.axis span:nth-child(2){text-align:center}input[type=range]{accent-color:var(--accent)}@media(max-width:560px){.palette{grid-template-columns:repeat(4,minmax(0,1fr))}.stamp .face{max-width:57px}main{padding-top:13px}canvas{height:228px}.tracks{grid-template-columns:repeat(3,minmax(0,1fr))}}

const curve=$('curve'), chart=$('chart'), graph=$('graph'), lane=$('lane');
const ctx=graph.getContext('2d');
const codes={Happy:'h',Angry:'a',Sad:'s',Desire:'d',Weird:'w',Criminal:'c','The Funk':'f',Triumph:'t'};
const tempos=['Slow','Relaxed','Mid','Brisk','Fast'];
const verticalInset=15;
const points=[{x:0,y:0},{x:.32,y:1},{x:.68,y:1},{x:1,y:0}];
const moods=new Map();
let gesture=null, curveEdited=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const theme=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const trackAt=x=>{
 const r=graph.getBoundingClientRect();
 return clamp(Math.floor(12*(x-r.left-22)/(r.width-44)),0,11);
};
function sample(t){
 const right=points.findIndex(point=>point.x>=t);
 if(right<=0)return points[0].y;
 const a=points[right-1],b=points[right],u=(t-a.x)/(b.x-a.x);
 return a.y+(b.y-a.y)*u*u*(3-2*u);
}
function targets(){
 let mood;
 return Array.from({length:12},(_,i)=>{
   mood=moods.get(i)??mood;
   return {mood,tempo:Math.round(sample((i+.5)/12))||0};
 });
}
function encode(){
 let last;
 return 'c1:'+targets().map(({mood,tempo})=>{
   const entry=String(tempo)+(mood===last?'':mood.split(' + ').map(name=>codes[name]).join(''));
   last=mood;
   return entry;
 }).join('');
}
function reportCurve(){
 parent.postMessage({type:'ghg-mix-curve',code:curveEdited?encode():'',height:document.querySelector('main').offsetHeight},'*');
}
function draw(){
 const w=graph.clientWidth,h=graph.clientHeight;
 if(!w||!h)return;
 const d=devicePixelRatio||1;
 if(graph.width!==Math.round(w*d)||graph.height!==Math.round(h*d)){
   graph.width=Math.round(w*d);graph.height=Math.round(h*d);
 }
 ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
 const x=t=>22+t*(w-44),y=e=>verticalInset+(2-e)*(h-2*verticalInset)/4;
 ctx.beginPath();
 ctx.moveTo(x(0),y(0));ctx.lineTo(x(1),y(0));
 ctx.strokeStyle=theme('--line');ctx.globalAlpha=.6;ctx.lineWidth=1;ctx.stroke();
 ctx.globalAlpha=1;
 ctx.beginPath();
 for(let i=0;i<=120;i++){
   const t=i/120;
   ctx[i?'lineTo':'moveTo'](x(t),y(sample(t)));
 }
 ctx.strokeStyle=theme('--curve-line');ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
 points.forEach((point,i)=>{
   const button=$('handles').children[i];
   button.style.left=x(point.x)+'px';
   button.style.top=y(point.y)+'px';
   const label=['Start','First bend','Second bend','Finish'][i];
   button.setAttribute('aria-label',label+' · '+tempos[point.y+2]);
   button.title=label+' · '+tempos[point.y+2];
 });
 reportCurve();
}
function setPoint(i,x,y){
 curveEdited=true;
 const point=points[i];
 if(i===1||i===2)point.x=clamp(x,points[i-1].x+.09,points[i+1].x-.09);
 point.y=clamp(Math.round(y),-2,2);
 $('hint').textContent=tempos[point.y+2];
 draw();
}
function movePoint(i,e){
 const r=graph.getBoundingClientRect();
 setPoint(i,gesture.startX+(e.clientX-gesture.x)/(r.width-44),
   gesture.startY-4*(e.clientY-gesture.y)/(r.height-2*verticalInset));
}
points.forEach((point,i)=>{
 const handle=document.createElement('button');
 handle.className='handle';
 handle.onpointerdown=e=>{
   if(gesture||e.button!==0)return;
   gesture={type:'curve',pointer:e.pointerId,i,x:e.clientX,y:e.clientY,startX:point.x,startY:point.y};
   handle.setPointerCapture(e.pointerId);
 };
 handle.onkeydown=e=>{
   const steps={ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1/12,0],ArrowRight:[1/12,0]};
   if(!steps[e.key])return;
   e.preventDefault();
   const [dx,dy]=steps[e.key];setPoint(i,point.x+dx,point.y+dy);
 };
 $('handles').append(handle);
});
function portrait(mood){
 const face=document.createElement('span');
 const i=Object.keys(codes).indexOf(mood);
 face.className='face';
 face.setAttribute('aria-hidden','true');
 face.style.setProperty('--px',((i%4)/3*100)+'%');
 face.style.setProperty('--py',i<4?'0%':'74%');
 // The strip uses only the artwork inside each portrait tile.
 face.style.setProperty('--art-x',((7+92*(i%4))/292*100)+'%');
 face.style.setProperty('--art-y',((i<4?7:122)/159*100)+'%');
 return face;
}
const parts=mood=>mood?.split(' + ')??[];
function stampMarker(button,mood){
 button.replaceChildren(...parts(mood).map(portrait));
 button.title=mood??'';
}
function renderMoods(){
 lane.replaceChildren();
 if(!moods.size){
   const hint=document.createElement('span');
   hint.className='empty-strip';
   hint.textContent='Drag mood(s) here';
   lane.append(hint);
 }
 for(const [track,mood] of [...moods].sort(([a],[b])=>a-b)){
   const pin=document.createElement('button');
   pin.className='pin';pin.dataset.track=track;stampMarker(pin,mood);
   pin.style.left=((track+.5)/12*100)+'%';
   pin.setAttribute('aria-label',mood+', track '+(track+1)+'. Delete to remove, arrow keys to move.');
   pin.onpointerdown=e=>{startMoodDrag(e,pin,mood,track)};
   pin.onkeydown=e=>{
     if(!['Delete','Backspace','ArrowLeft','ArrowRight'].includes(e.key))return;
     e.preventDefault();moods.delete(track);
     const direction={ArrowLeft:-1,ArrowRight:1}[e.key];
     if(direction)moods.set(clamp(track+direction,0,11),mood);
     renderMoods();
     if(direction)lane.querySelector('[data-track="'+clamp(track+direction,0,11)+'"]')?.focus();
     else curve.querySelector('summary').focus();
   };
   lane.append(pin);
 }
 $('count').textContent=moods.size?moods.size+' mood changes':'';
 draw();
}
function place(track,mood){
 curveEdited=true;
 moods.set(track,mood);renderMoods();
}
function startMoodDrag(e,element,mood,from){
 if(gesture||e.button!==0)return;
 gesture={type:'mood',pointer:e.pointerId,mood,from,x:e.clientX,y:e.clientY};
 element.setPointerCapture(e.pointerId);
}
function inside(e,drag){
 const moving=drag.from!==undefined;
 const r=(moving?lane:chart).getBoundingClientRect();
 const margin=moving?26:0;
 return e.clientX>=r.left-margin&&e.clientX<=r.right+margin&&
   e.clientY>=r.top-margin&&e.clientY<=r.bottom+margin;
}
const ghost=document.createElement('span');
ghost.className='drag-mood';ghost.hidden=true;document.body.append(ghost);
document.addEventListener('pointermove',e=>{
 if(gesture?.pointer!==e.pointerId)return;
 if(gesture.type==='curve'){movePoint(gesture.i,e);return}
 if(!gesture.active&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<7)return;
 if(!gesture.active)gesture.active=true;
 const canDrop=inside(e,gesture);
 ghost.textContent=gesture.from!==undefined&&!canDrop?'Release to remove':gesture.mood;
 ghost.hidden=false;
 ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
 chart.classList.toggle('drop-ready',canDrop);
});
function endGesture(e){
 if(gesture?.pointer!==e.pointerId)return;
 const current=gesture;gesture=null;ghost.hidden=true;chart.classList.remove('drop-ready');
 if(e.type!=='pointerup'||current.type!=='mood'||!current.active)return;
 if(current.from!==undefined)moods.delete(current.from);
 if(inside(e,current))place(trackAt(e.clientX),current.mood);
 else renderMoods();
}
document.addEventListener('pointerup',endGesture);
document.addEventListener('pointercancel',endGesture);
document.addEventListener('lostpointercapture',endGesture);
const moodNames={happy:"Happy",angry:"Angry",sad:"Sad",desire:"Desire",weird:"Weird",criminal:"Criminal",funky:"The Funk",triumphant:"Triumph"};
window.addEventListener("message",event=>{
 if(event.source!==parent)return;
 const data=event.data;
 if(data?.type==="ghg-portrait-drag"){curve.open=true;return}
 if(data?.type!=="ghg-portrait-drop"||!Array.isArray(data.moods)||data.moods.length<1||data.moods.length>2)return;
 if(data.moods.some(name=>!Object.hasOwn(moodNames,name))||new Set(data.moods).size!==data.moods.length)return;
 if(!Number.isFinite(data.x)||!Number.isFinite(data.y)||!inside({clientX:data.x,clientY:data.y},{}))return;
 place(trackAt(data.x),data.moods.map(name=>moodNames[name]).join(" + "));
});
new ResizeObserver(reportCurve).observe(document.querySelector("main"));
new ResizeObserver(draw).observe(graph);
curve.addEventListener('toggle',draw);
renderMoods();
</script></html>
