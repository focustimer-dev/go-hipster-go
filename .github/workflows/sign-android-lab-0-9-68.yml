name: Sign canonical Android Lab 0.9.68 (manual release)

# Only run from a tested main commit after reviewing the release PR.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: android-lab-canonical-0-9-68
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require main and successful Android Lab CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Signed canonical APK must be built from main"
            exit 1
          }
          result="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name=="lab" and .head_sha=="'"${GITHUB_SHA}"'") | .conclusion] | first // ""')"
          test "$result" = "success" || {
            echo "::error::The exact main commit does not have a green Android Lab CI run"
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Build and check the optimized Android Lab
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python -m pip install Pillow==12.0.0
          python -m unittest discover -s android-lab/tests -v
          bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - name: Verify exact package and version, then align
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          badging="$("$tools/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='77' versionName='0.9.68'"* ]] || {
            echo "::error::Unexpected package/version; no signing"
            exit 1
          }
          "$tools/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/lab-aligned.apk"
          "$tools/zipalign" -c 4 "$RUNNER_TEMP/lab-aligned.apk"
      - name: Sign with existing canonical Android Lab certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" && test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || {
            echo "::error::Missing canonical Lab signing secrets"
            exit 1
          }
          umask 077
          keystore="$RUNNER_TEMP/hipster-go-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          args=(--ks "$keystore" --ks-key-alias hipster-go --ks-pass env:ANDROID_KEYSTORE_PASSWORD)
          if [[ -n "${ANDROID_KEY_PASSWORD:-}" ]]; then args+=(--key-pass env:ANDROID_KEY_PASSWORD); fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign "${args[@]}" \
            --out Hipster-GO-Lab-0.9.68-signed.apk "$RUNNER_TEMP/lab-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs Hipster-GO-Lab-0.9.68-signed.apk
          cert="$("$tools/apksigner" verify --print-certs Hipster-GO-Lab-0.9.68-signed.apk)"
          [[ "$cert" == *"Signer #1 certificate SHA-256 digest: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0"* ]] || {
            echo "::error::Wrong signer; refusing an APK that cannot upgrade the existing Lab"
            exit 1
          }
          "$tools/zipalign" -c 4 Hipster-GO-Lab-0.9.68-signed.apk
          sha256sum Hipster-GO-Lab-0.9.68-signed.apk
          printf 'Version: 0.9.68 (code 77)\nSource commit: %s\nPackage: work.samelling.hipstergo.lab\nCertificate SHA256: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0\n' "$GITHUB_SHA" > Hipster-GO-Lab-0.9.68-release-info.txt
      - name: Publish signed APK and identity record, never the key
        uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.68-canonical-signed
          path: |
            Hipster-GO-Lab-0.9.68-signed.apk
            Hipster-GO-Lab-0.9.68-release-info.txt
          retention-days: 7
          if-no-files-found: error
