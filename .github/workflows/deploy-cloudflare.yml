name: Deploy Go Hipster Go to Cloudflare

on:
  workflow_dispatch:
  # Production push deploys are opt-in, using explicit one-time approved release markers.
  push:
    branches: [main]
    paths:
      - '.github/one-shot-clean-mood-art-2026-11-01'
      - '.github/releases/mood-quality-2026-11-01'
      - '.github/releases/pwa-0-9-56-2026-11-06'
      - '.github/releases/pwa-0-9-56-qa-fix-2026-11-06'
      - '.github/releases/pwa-three-map-link-cleanup-2026-11-06'
      - '.github/releases/inspiration-metadata-2026-11-06'
      - '.github/releases/pwa-skill-3-11-2-2026-11-06'
      - '.github/releases/pwa-theme-atlas-integration-2026-11-07'
      - '.github/releases/pwa-android-eight-themes-2026-11-10'
      - '.github/releases/pwa-michoacan-2026-11-10'
      - '.github/releases/pwa-tempo-curve-2026-11-11'
      - '.github/releases/pwa-michoacan-contrast-2026-11-11'
      - '.github/releases/play-legal-pages-2026-11-14'

permissions:
  contents: read

concurrency:
  group: hipster-go-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for approved Funk artwork
        run: python -m pip install Pillow==12.0.0
      - name: Build edition and run tests
        run: |
          python scripts/build_gig_poster.py
          git diff --exit-code -- launcher/editions/gig-poster
          python -m unittest discover -s tests
      - name: Confirm release credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN as a production environment secret"; exit 1; }
      - name: Set exact release commit
        run: sed -i "s/__GITHUB_SHA__/${GITHUB_SHA}/g" wrangler.toml
      - name: Include approved 0.9.56 three-map Atlas in public assets
        run: |
          python scripts/build_pwa_atlas_preview.py
          test -s launcher/pwa-atlas/index.html
          test -s launcher/pwa-atlas/assets/maplibre/maplibre-gl.js
          test -s launcher/pwa-atlas/assets/cahill-keyes-vendor.js
          test -s launcher/pwa-atlas/assets/pwa-atlas-bridge.js
          test -s launcher/pwa-atlas/assets/pwa-atlas-themes.css
          test -s launcher/assets/pwa-themes.css
      - name: Deploy entire static site
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.156.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 47b318c510ebbdc3a45ddeafeda4a18f
          command: deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live site matches release
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/smoke_live.mjs --expected-commit "$GITHUB_SHA"
      - name: Verify public PWA Manual, Crate and all three Atlas views
        env:
          PWA_PREVIEW_URL: https://hipster-go.samelling.workers.dev
        run: node scripts/pwa_preview_qa.mjs --allow-production
