name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check browser workspace syntax
        run: |
          node --check launcher/assets/pwa-workspace.js
          node --check launcher/assets/app.js
      - name: Verify files and examples
        run: |
          python scripts/playlist_cli.py check-skill
          python scripts/build_agent_packages.py --check
          python scripts/build_agent_packages.py --zip
          python scripts/playlist_cli.py validate examples/example-playlist.json
          python -m unittest discover -s tests -v
          python scripts/qualify_skill_release.py --check
      - name: Keep isolated ChatGPT RC source ZIP for controlled test
        if: ${{ github.event_name == 'pull_request' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: ghg-pr5-chatgpt-candidate-source
          path: dist/go-hipster-go-chatgpt-plugin.zip
          retention-days: 1
          if-no-files-found: error
