name: Android Lab 0.9.46 Smooth Atlas Preview (build only)
on:
  push:
    branches: [polish/lab-0-9-46-atlas-motion]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m unittest discover -s android-lab/tests -v
      - run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - name: Validate normal Lab package identity
        shell: bash
        run: |
          set -euo pipefail
          apk=android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='55' versionName='0.9.46'"* ]] || {
            echo "::error::Wrong package ID or version"; exit 1;
          }
          sha256sum "$apk"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_atlas_vector_morph.cjs
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install chromium
      - run: node scripts/test_atlas_vector_transition.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.46-smooth-atlas-unsigned
          path: android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  # Signing is a separate runner. It never checks out or executes the Lab branch.
  sign:
    name: Sign phone-preview APK
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hipster-go-lab-0.9.46-smooth-atlas-unsigned
          path: unsigned
      - name: Verify package identity and align
        shell: bash
        run: |
          set -euo pipefail
          test -s unsigned/app-release-unsigned.apk
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/aapt" && test -x "$tools/zipalign" && test -x "$tools/apksigner"
          badging="$("$tools/aapt" dump badging unsigned/app-release-unsigned.apk)"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='55' versionName='0.9.46'"* ]] ||
            { echo '::error::Wrong version or package; refusing to sign'; exit 1; }
          "$tools/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/lab-aligned.apk"
          "$tools/zipalign" -c 4 "$RUNNER_TEMP/lab-aligned.apk"
          echo "LAB_SIGN_BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
      - name: Sign with existing Lab certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$ANDROID_KEYSTORE_PASSWORD" ||
            { echo '::error::Lab signing secrets unavailable'; exit 1; }
          umask 077
          ks="$RUNNER_TEMP/hipster-go-lab.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          test -s "$ks"
          args=(--ks "$ks" --ks-key-alias hipster-go --ks-pass env:ANDROID_KEYSTORE_PASSWORD)
          if [[ -n "$ANDROID_KEY_PASSWORD" ]]; then args+=(--key-pass env:ANDROID_KEY_PASSWORD); fi
          "$LAB_SIGN_BUILD_TOOLS/apksigner" sign "${args[@]}" \
            --out Hipster-GO-Lab-0.9.46.apk "$RUNNER_TEMP/lab-aligned.apk"
          "$LAB_SIGN_BUILD_TOOLS/apksigner" verify --verbose Hipster-GO-Lab-0.9.46.apk
          cert="$($LAB_SIGN_BUILD_TOOLS/apksigner verify --print-certs Hipster-GO-Lab-0.9.46.apk)"
          [[ "$cert" == *"Signer #1 certificate SHA-256 digest: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0"* ]] ||
            { echo '::error::Signer is not the installed Lab certificate'; exit 1; }
          sha256sum Hipster-GO-Lab-0.9.46.apk
      - name: Upload signed 0.9.46 phone preview
        uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.46-signed-apk
          path: Hipster-GO-Lab-0.9.46.apk
          retention-days: 7
          if-no-files-found: error
