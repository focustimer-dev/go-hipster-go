name: Android Lab 0.9.40 Morph Candidate (build only)
on:
  push:
    branches: [test/android-morph-apk-0-9-40]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m unittest discover -s android-lab/tests -v
      - run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - name: Validate normal Lab package identity
        shell: bash
        run: |
          set -euo pipefail
          apk=android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='49' versionName='0.9.40'"* ]] || {
            echo "::error::Wrong package ID or version"; exit 1;
          }
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.40-morph-unsigned
          path: android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
