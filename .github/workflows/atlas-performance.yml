name: Atlas performance comparison
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full commit SHA to compare against the selected branch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-performance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Compare the selected branch with the requested baseline
        env:
          baseline: ${{ inputs.baseline_sha }}
        run: |
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git worktree add --detach /tmp/atlas-baseline "$baseline"
          python /tmp/atlas-baseline/scripts/bundle_android_lab.py
          python scripts/bundle_android_lab.py
          mkdir -p android-lab/build/atlas-perf
          node scripts/profile_atlas.cjs /tmp/atlas-baseline/android-lab/app/src/main/assets/site android-lab/app/src/main/assets/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-performance
          path: android-lab/build/atlas-perf/
