name: Android production RC + isolated QA APK (no deployment)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-production/**'
      - 'android-lab/**'
      - 'launcher/**'
      - 'scripts/bundle_android_lab.py'
      - 'scripts/bundle_android_production.py'
      - 'scripts/test_android_production_contract.py'
      - 'scripts/android_release_evidence.py'
      - 'scripts/audit_android_release_package.py'
      - 'scripts/sync_stable_skill_links.py'
      - 'config/stable-skill-release.json'
      - 'scripts/test_android_play_readiness.py'
      - 'docs/android-privacy-policy-draft.md'
      - 'launcher/privacy/**'
      - 'launcher/support/**'
      - 'android-lab/app/src/main/java/work/samelling/hipstergo/lab/SharedInspiration.java'
      - 'docs/android-play-store-readiness.md'
      - 'docs/android-play-data-safety-review.md'
      - 'docs/android-play-asset-shotlist.md'
      - 'config/google-play-listing.en-US.json'
      - 'scripts/render_chaos_widget.py'
      - '.github/workflows/android-production-rc.yml'
  pull_request:
    paths:
      - 'android-production/**'
      - 'android-lab/**'
      - 'launcher/**'
      - 'scripts/bundle_android_lab.py'
      - 'scripts/bundle_android_production.py'
      - 'scripts/test_android_production_contract.py'
      - 'scripts/android_release_evidence.py'
      - 'scripts/audit_android_release_package.py'
      - 'scripts/sync_stable_skill_links.py'
      - 'config/stable-skill-release.json'
      - 'scripts/test_android_play_readiness.py'
      - 'docs/android-privacy-policy-draft.md'
      - 'launcher/privacy/**'
      - 'launcher/support/**'
      - 'android-lab/app/src/main/java/work/samelling/hipstergo/lab/SharedInspiration.java'
      - 'docs/android-play-store-readiness.md'
      - 'docs/android-play-data-safety-review.md'
      - 'docs/android-play-asset-shotlist.md'
      - 'config/google-play-listing.en-US.json'
      - 'scripts/render_chaos_widget.py'
      - '.github/workflows/android-production-rc.yml'

permissions:
  contents: read

concurrency:
  group: android-production-rc-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-preflight:
    name: Validate native production, unsigned APK/AAB and signed QA-only APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m pip install Pillow==12.0.0
      - name: Shared Lab/native and production packaging contracts
        run: |
          python -m unittest discover -s android-lab/tests -v
          python scripts/test_android_production_contract.py
          python scripts/test_android_play_readiness.py
          python scripts/sync_stable_skill_links.py
      - name: Native production and isolated QA tests, lint, APK and AAB
        run: bash android/gradlew -p android-production testReleaseUnitTest testQaUnitTest lintVitalRelease assembleRelease bundleRelease assembleQa --no-daemon
      - name: Verify unsigned production package identity
        run: |
          set -euo pipefail
          apk=android-production/app/build/outputs/apk/release/app-release-unsigned.apk
          aab=android-production/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "name='work.samelling.hipstergo' versionCode='100000' versionName='1.0.0-rc.1'"
          test "$(unzip -p "$aab" BundleConfig.pb | wc -c)" -gt 0
          sha256sum "$apk" "$aab"
      - name: Verify installable, non-debuggable, isolated QA APK
        shell: bash
        run: |
          set -euo pipefail
          qa=android-production/app/build/outputs/apk/qa/app-qa.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$qa"
          "$tools/aapt" dump badging "$qa" | grep -F "name='work.samelling.hipstergo.qa' versionCode='100000' versionName='1.0.0-rc.1'"
          "$tools/aapt" dump badging "$qa" | grep -F "application-label:'Go, Hipster, Go! RC'"
          if "$tools/aapt" dump badging "$qa" | grep -q '^application-debuggable'; then
            echo "::error::QA APK must not be debuggable"
            exit 1
          fi
          "$tools/apksigner" verify --verbose --print-certs "$qa"
          # Signing via the GitHub runner's temporary debug key is for
          # app-ID-isolated phone QA ONLY, never a Play upload or future upgrade.
          printf 'QA ONLY, NOT FOR GOOGLE PLAY\npackage: work.samelling.hipstergo.qa\nversion: 1.0.0-rc.1 (100000)\nsource commit: %s\nsigning: temporary runner debug key; uninstall before upgrading\n' "$GITHUB_SHA" \
            > android-production/app/build/outputs/apk/qa/qa-build-info.txt
          sha256sum "$qa"
      - name: Audit compiled package privacy, manifest and native-library surface
        shell: bash
        run: |
          set -euo pipefail
          report=android-production/app/build/release-evidence
          mkdir -p "$report"
          python scripts/audit_android_release_package.py \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --production-apk android-production/app/build/outputs/apk/release/app-release-unsigned.apk \
            --production-aab android-production/app/build/outputs/bundle/release/app-release.aab \
            --qa-apk android-production/app/build/outputs/apk/qa/app-qa.apk \
            --output "$report/compiled-package-audit.json"
          # Capture the resolved *release* library tree for the Data safety / SDK audit.
          # This is evidence to review, not a claim that Google approved the SDKs.
          bash android/gradlew -p android-production :app:dependencies \
            --configuration releaseRuntimeClasspath --no-daemon \
            > "$report/runtime-dependencies.txt"
      - name: Verify production APK is unsigned and create keyless artifact evidence
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          prod=android-production/app/build/outputs/apk/release/app-release-unsigned.apk
          qa=android-production/app/build/outputs/apk/qa/app-qa.apk
          if "$tools/apksigner" verify "$prod" > /dev/null 2>&1; then
            echo "::error::Production APK was signed before M0/M5 approval"
            exit 1
          fi
          fingerprint=$("$tools/apksigner" verify --print-certs "$qa" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          python scripts/android_release_evidence.py \
            --output android-production/app/build/release-evidence.json \
            --source-head "$SOURCE_HEAD" \
            --qa-certificate-sha256 "$fingerprint"
          mkdir -p android-production/app/build/release-evidence
          (
            cd android-production/app/build/outputs
            sha256sum apk/release/app-release-unsigned.apk \
                      bundle/release/app-release.aab \
                      apk/qa/app-qa.apk
          ) > android-production/app/build/release-evidence/SHA256SUMS
          cp android-production/app/build/release-evidence.json \
            android-production/app/build/release-evidence/release-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-android-rc-evidence
          path: android-production/app/build/release-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-android-qa-sideload
          path: |
            android-production/app/build/outputs/apk/qa/app-qa.apk
            android-production/app/build/outputs/apk/qa/qa-build-info.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-production-rc-unsigned
          path: |
            android-production/app/build/outputs/apk/release/app-release-unsigned.apk
            android-production/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
