name: Android Lab (no deployment)
on:
  workflow_dispatch:
  push:
    branches: [main, release/lab-0-9-8, release/lab-0-9-7, release/lab-0-9-6, fix/lab-handoff-consistency]
  pull_request:
    paths:
      - 'android-lab/**'
      - 'scripts/bundle_android_lab.py'
      - 'scripts/test_android_lab.cjs'
      - 'scripts/test_cahill_motion.cjs'
      - 'scripts/test_cahill_region_fit.cjs'
      - 'scripts/test_android_lab_dom.cjs'
      - 'scripts/test_android_lab_themes.cjs'
      - 'scripts/test_lab_discovery_routes.cjs'
      - 'scripts/test_mood_ink.cjs'
      - 'launcher/**'
      - 'scripts/atlas_navigation.py'
      - 'scripts/robinson_atlas.py'
      - 'scripts/build_gig_poster.py'
      - 'scripts/test_render_efficiency.cjs'
      - '.github/workflows/android-lab.yml'
permissions:
  contents: read
concurrency:
  group: android-lab-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m pip install Pillow==12.0.0
      # User-requested, side-by-side installable review APK. Keep the
      # official Android release and existing device data untouched.
      - name: Build signed Kingston + Detroit Theme Review
        run: |
          bash android/gradlew -p android-lab assembleReview --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-lab/app/build/outputs/apk/review/app-review.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-lab/app/build/outputs/apk/review/app-review.apk | head -n 4
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-kingston-detroit-signed-review
          path: android-lab/app/build/outputs/apk/review/app-review.apk
          retention-days: 7
          if-no-files-found: error
      - run: python -m unittest discover -s android-lab/tests -v
      - run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-unsigned-preflight
          path: android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error
      - name: Prepare official Android signing tools for local release verification
        run: |
          mkdir -p android-lab/build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-lab/build/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-lab/build/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" android-lab/build/signing-tools/
          if [ -d "$ANDROID_HOME/build-tools/35.0.0/lib64" ]; then cp -R "$ANDROID_HOME/build-tools/35.0.0/lib64" android-lab/build/signing-tools/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-verification-tools
          path: android-lab/build/signing-tools/
          retention-days: 1
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1 jsdom@26.1.0
      - run: node scripts/test_lab_discovery_routes.cjs
      - run: node scripts/test_android_lab_dom.cjs
      - run: node scripts/test_render_efficiency.cjs
      - run: node scripts/test_atlas_boundary.cjs
      - run: npx playwright install --with-deps chromium
      # Bound headless browser tests explicitly. A stalled SwiftShader frame
      # or orphaned Playwright wait must fail this stage, not monopolize the
      # entire Android build. 124 means the watchdog expired.
      - name: Phone theme and three-projection regression (4m watchdog)
        run: timeout --signal=TERM --kill-after=10s 240s node scripts/test_android_lab_themes.cjs
      - name: Save native theme phone screenshots independently of unrelated Atlas motion checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-theme-phone-review
          path: android-lab/build/theme-review/*.png
          if-no-files-found: warn
      - name: Cahill touch and region fit (2m watchdog)
        run: timeout --signal=TERM --kill-after=10s 120s node scripts/test_cahill_region_fit.cjs
      # Gate on functional projection state, geometry, touch and routes,
      # not timing of SwiftShader's headless renderer callback.
      # Detailed map-animation timing stays an optional diagnostic in
      # test_cahill_motion.cjs (issue #183); Android Lab still fails when
      # the actual selected projection or app behavior is wrong.
      - name: Native interface and handoff regression (4m watchdog)
        run: timeout --signal=TERM --kill-after=10s 240s node scripts/test_android_lab.cjs
      - name: Android Manual walkthrough regression (2m watchdog)
        run: timeout --signal=TERM --kill-after=10s 120s node scripts/test_lab_tutorial.cjs
      - name: Original mood portrait integrity (2m watchdog)
        run: timeout --signal=TERM --kill-after=10s 120s node scripts/test_mood_ink.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-unsigned-apk
          path: |
            android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
            android-lab/build/switch-review/*.png
            android-lab/build/motion-review/*.png
            android-lab/build/theme-review/*.png
          if-no-files-found: error

