name: Publish portable skill ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/build_gemini_app_skill.py'
      - 'scripts/build_agent_packages.py'
      - 'plugin.json'
      - '.claude-plugin/**'
      - 'skills/setup/**'
      - 'adapters/streaming/**'
      - 'schemas/**'
      - 'scripts/playlist_cli.py'
      - '.github/workflows/publish-gemini-skill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-skill-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Claude and Gemini packages from canonical sources
        run: python scripts/build_agent_packages.py --zip
      - name: Validate upload structures
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path=Path('dist/go-hipster-go-gemini-app-skill.zip')
          assert path.is_file()
          with ZipFile(path) as z:
              assert z.namelist() == [
                  'SKILL.md',
                  'references/global-scenes.md',
                  'references/sonic-taxonomy.md',
                  'references/curation-examples.md',
                  'references/verification.md',
              ]
              text=z.read('SKILL.md').decode('utf-8')
              assert '## The personality is mandatory in Gemini' in text
              assert 'DeBarge Protocol' in text and '25 consecutive' in text
              assert 'scripts/' not in text and 'python ' not in text.lower()
          claude=Path('dist/go-hipster-go-claude-skill.zip')
          plugin=Path('dist/go-hipster-go-claude-plugin.zip')
          assert claude.is_file() and plugin.is_file()
          with ZipFile(claude) as z:
              assert 'go-hipster-go/SKILL.md' in z.namelist()
              assert 'go-hipster-go/references/global-scenes.md' in z.namelist()
              front=z.read('go-hipster-go/SKILL.md').decode('utf-8')
              desc=next(line[len('description: '):] for line in front.splitlines() if line.startswith('description: '))
              assert len(desc) <= 200, 'Claude frontmatter description too long'
          with ZipFile(plugin) as z:
              assert '.claude-plugin/plugin.json' in z.namelist()
              assert 'skills/setup/SKILL.md' in z.namelist()
              assert 'skills/go-hipster-go/SKILL.md' in z.namelist()
          with ZipFile('dist/go-hipster-go-chatgpt-plugin.zip') as z:
              assert 'plugin.json' in z.namelist()
              assert 'skills/setup/SKILL.md' in z.namelist()
              assert 'skills/go-hipster-go/SKILL.md' in z.namelist()
              assert 'assets/icon.svg' in z.namelist()
              import json
              assert json.loads(z.read('plugin.json'))['name'] == 'go-hipster-go'
          expected={
              "go-hipster-go-gemini-app-skill.zip",
              "go-hipster-go-claude-skill.zip",
              "go-hipster-go-claude-plugin.zip",
              "go-hipster-go-chatgpt-plugin.zip",
          }
          actual={p.name for p in Path('dist').glob('*.zip')}
          assert actual == expected, f'Unexpected package ZIPs: {sorted(actual ^ expected)}'
          for package in sorted(Path('dist').glob('*.zip')):
              with ZipFile(package) as z:
                  skill_path=next(n for n in z.namelist() if n.endswith('SKILL.md') and 'setup' not in n)
                  assert 'Regional discovery and recording quality' in z.read(skill_path).decode('utf-8'), f'{package.name}: regional guidance missing'
                  taxonomy_path=next(n for n in z.namelist() if n.endswith('references/sonic-taxonomy.md'))
                  assert 'Recording-level selection gate' in z.read(taxonomy_path).decode('utf-8'), f'{package.name}: recording quality guidance missing'
          print('All four platform ZIPs verified, including regional and recording-quality guidance.')
          PY
      - name: Determine versioned release tag
        id: version
        run: |
          version=$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')
          echo "tag=gemini-skill-v${version}" >> "$GITHUB_OUTPUT"
      - name: Publish verified platform ZIPs as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          files=(
            dist/go-hipster-go-gemini-app-skill.zip
            dist/go-hipster-go-claude-skill.zip
            dist/go-hipster-go-claude-plugin.zip
            dist/go-hipster-go-chatgpt-plugin.zip
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Go, Hipster, Go! platform packages (${RELEASE_TAG})" \
              --notes 'Ready-to-upload Gemini, Claude and ChatGPT plugin/skill ZIPs; each requires the music-service authorization separately.' \
              --latest
          fi
          # Only retire the four known pre-rename aliases from this version's release.
          # Historical releases and the four current Go, Hipster, Go! ZIPs are untouched.
          for legacy in \
            hipster-music-generator-gemini-app-skill.zip \
            hipster-music-generator-claude-skill.zip \
            hipster-music-generator-claude-plugin.zip \
            hipster-music-generator-chatgpt-plugin.zip
          do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$legacy"; then
              gh release delete-asset "$RELEASE_TAG" "$legacy" --yes
            fi
          done
          gh release view "$RELEASE_TAG" --json url,assets
      - name: Save ChatGPT installable ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-hipster-go-chatgpt-plugin
          path: dist/go-hipster-go-chatgpt-plugin.zip
          if-no-files-found: error
