name: Android Lab (no deployment)
on:
  workflow_dispatch:
  push:
    branches: [release/lab-0-9-7, release/lab-0-9-6, fix/lab-handoff-consistency]
  pull_request:
    paths:
      - 'android-lab/**'
      - 'scripts/bundle_android_lab.py'
      - 'scripts/test_android_lab.cjs'
      - 'scripts/test_android_lab_dom.cjs'
      - 'scripts/test_lab_discovery_routes.cjs'
      - 'scripts/test_mood_ink.cjs'
      - 'launcher/editions/gig-poster/**'
      - '.github/workflows/android-lab.yml'
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m unittest discover -s android-lab/tests -v
      - run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright jsdom@26
      - run: node scripts/test_lab_discovery_routes.cjs
      - run: node scripts/test_android_lab_dom.cjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_android_lab.cjs
      - run: node scripts/test_mood_ink.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-unsigned-apk
          path: |
            android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
            android-lab/build/switch-review/*.png
          if-no-files-found: error
