name: Android Lab 0.9.55 preview APK (unsigned, no deployment)

on:
  push:
    branches: [experiment/lab-0-9-55-keyes-fold-motion]
    paths:
      - 'android-lab/**'
      - 'launcher/**'
      - 'scripts/**'
      - '.github/workflows/android-lab-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lab-0955-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m pip install Pillow==12.0.0
      - name: Verify native checks and assemble preview
        run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
      - name: Verify package and record digest
        shell: bash
        run: |
          set -euo pipefail
          apk=android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='64' versionName='0.9.55'"* ]] ||
            { echo "::error::Wrong Lab package or version"; exit 1; }
          sha256sum "$apk"
          mkdir -p android-lab/build/preview-apk
          cp "$apk" android-lab/build/preview-apk/Hipster-GO-Lab-0.9.55-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.55-preview-unsigned
          path: android-lab/build/preview-apk/Hipster-GO-Lab-0.9.55-unsigned.apk
          retention-days: 7
          if-no-files-found: error
      - name: Export official Android SDK signing tools (no keys)
        shell: bash
        run: |
          set -euo pipefail
          source="$ANDROID_HOME/build-tools/35.0.0"
          target=android-lab/build/preview-sign-tools
          mkdir -p "$target"
          cp "$source/lib/apksigner.jar" "$target/"
          cp "$source/zipalign" "$target/"
          cp "$source/aapt" "$target/"
          if [ -d "$source/lib64" ]; then cp -R "$source/lib64" "$target/"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-lab-official-signing-tools
          path: android-lab/build/preview-sign-tools/
          retention-days: 2
          if-no-files-found: error
