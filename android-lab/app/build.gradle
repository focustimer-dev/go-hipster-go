plugins { id 'com.android.application' }
android {
    namespace 'work.samelling.hipstergo.lab'
    compileSdkVersion 36
    defaultConfig {
        applicationId 'work.samelling.hipstergo.lab'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 90
        versionName '0.9.80'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}
tasks.register('bundleLab', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/bundle_android_lab.py'
    inputs.dir '../../launcher'
    inputs.file '../../scripts/bundle_android_lab.py'
    inputs.file '../../scripts/render_chaos_widget.py'
    outputs.dir 'src/main/res/drawable-nodpi'
    inputs.file 'build.gradle'
    inputs.dir '../web'
    outputs.dir 'src/main/assets/site'
}
preBuild.dependsOn bundleLab
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.24.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
