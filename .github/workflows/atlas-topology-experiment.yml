name: Atlas topology experiment (no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/atlas-topology-experiment.yml'
      - 'scripts/atlas_topology_experiment.mjs'
      - 'docs/atlas-topology-experiment.md'
      - 'assets/us-region-state-boundaries.json'
permissions:
  contents: read
jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned experiment-only geometry tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            topojson-client@3.1.0 topojson-server@3.0.1 d3-geo@3.1.1 \
            d3-geo-projection@4.0.0 d3-geo-polygon@2.0.1
      - name: Compare canonical US-region meshes and D3 projections
        run: node scripts/atlas_topology_experiment.mjs --out artifacts/atlas-topology-experiment
      - name: Save metrics and visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-topology-experiment
          path: artifacts/atlas-topology-experiment/
          if-no-files-found: warn
