name: Approved Android Lab 0.9.78 sign-once
on:
  push:
    branches: [release/android-lab-0-9-78-once]
permissions:
  contents: read
  actions: read
jobs:
  sign:
    if: github.repository == 'focustimer-dev/go-hipster-go'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 31a0d4b7f620a5d38a7af78b7ba3f0b8eb6d42cc
    steps:
      - name: Verify source and successful reviewed Android CI
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43404169924" --jq .head_sha)" = '53e279e0c718a38305f00f2c505f487d74dc18ce'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43404169924" --jq .conclusion)" = success
      - uses: actions/checkout@v4
        with:
          ref: 31a0d4b7f620a5d38a7af78b7ba3f0b8eb6d42cc
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Build validated 0.9.78 APK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python -m pip install Pillow==12.0.0
          python -m unittest discover -s android-lab/tests -v
          node tests/fixtures/curve_slot_audit.cjs
          bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease lintVitalRelease --no-daemon
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          badging="$("$tools/aapt" dump badging "$apk")"
          [[ "$badging" == *"name='work.samelling.hipstergo.lab' versionCode='88' versionName='0.9.78'"* ]]
          "$tools/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/zipalign" -c 4 "$RUNNER_TEMP/aligned.apk"
      - name: Sign and verify original Android Lab certificate
        env:
          KEYSTORE_B64: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HIPSTER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" && test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "::error::Signing credentials unavailable"; exit 1; }
          umask 077
          ks="$RUNNER_TEMP/hipster-go-release.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          test -s "$ks"
          args=(--ks "$ks" --ks-key-alias hipster-go --ks-pass env:ANDROID_KEYSTORE_PASSWORD)
          if [[ -n "${ANDROID_KEY_PASSWORD:-}" ]]; then args+=(--key-pass env:ANDROID_KEY_PASSWORD); fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign "${args[@]}" --out Hipster-GO-Lab-0.9.78-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs Hipster-GO-Lab-0.9.78-signed.apk
          cert="$("$tools/apksigner" verify --print-certs Hipster-GO-Lab-0.9.78-signed.apk)"
          [[ "$cert" == *"Signer #1 certificate SHA-256 digest: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0"* ]]
          "$tools/zipalign" -c 4 Hipster-GO-Lab-0.9.78-signed.apk
          sha256sum Hipster-GO-Lab-0.9.78-signed.apk
          printf 'Version: 0.9.78 (88)\nSource: %s\nCertificate SHA256: 2e1c2c7d0ae0a75daa6da443c0c3193f212a5a86e685c885c2e93400099a4af0\n' "$SOURCE_SHA" > Hipster-GO-Lab-0.9.78-release-info.txt
      - name: Upload installable signed artifact; never the key
        uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-0.9.78-signed
          path: |
            Hipster-GO-Lab-0.9.78-signed.apk
            Hipster-GO-Lab-0.9.78-release-info.txt
          retention-days: 7
          if-no-files-found: error
