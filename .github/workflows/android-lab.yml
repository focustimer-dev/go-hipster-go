name: Android Lab (no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-lab/**'
      - 'scripts/bundle_android_lab.py'
      - 'scripts/test_android_lab.cjs'
      - 'scripts/test_android_lab_dom.cjs'
      - '.github/workflows/android-lab.yml'
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python -m unittest discover -s android-lab/tests -v
      - run: bash android/gradlew -p android-lab testReleaseUnitTest assembleRelease --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright jsdom@26
      - run: node scripts/test_android_lab_dom.cjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_android_lab.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hipster-go-lab-unsigned-apk
          path: android-lab/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
