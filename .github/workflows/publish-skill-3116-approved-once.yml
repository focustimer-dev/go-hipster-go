name: Approved Go Hipster Go 3.11.6 release (single-use)

on:
  push:
    branches:
      - release/skill-3116-approved-once

permissions:
  contents: write

concurrency:
  group: gemini-skill-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'focustimer-dev/go-hipster-go' && github.ref == 'refs/heads/release/skill-3116-approved-once'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SOURCE: a384a76721f39d5e0bb0ef26d641bf0798d72558
      EXPECTED_TREE: accaf9d9ed8039f45a836066ad96d7466b95bc4a
      RELEASE_TAG: gemini-skill-v3.11.6
    steps:
      - name: Verify approved source, production snapshot and unused release tag
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'focustimer-dev/go-hipster-go'
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          prod_sha=$(gh api "repos/$GH_REPO/git/ref/heads/release/skill-prod" --jq '.object.sha')
          test "$main_sha" = "$EXPECTED_SOURCE"
          main_tree=$(gh api "repos/$GH_REPO/git/commits/$main_sha" --jq '.tree.sha')
          prod_tree=$(gh api "repos/$GH_REPO/git/commits/$prod_sha" --jq '.tree.sha')
          test "$main_tree" = "$EXPECTED_TREE"
          test "$prod_tree" = "$EXPECTED_TREE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing versioned GitHub release.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: a384a76721f39d5e0bb0ef26d641bf0798d72558
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and qualify exact approved packages
        run: |
          set -euo pipefail
          python scripts/build_agent_packages.py --check
          python scripts/build_agent_packages.py --zip
          python scripts/qualify_skill_release.py --check
          test "$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')" = '3.11.6'
          cat > /tmp/approved-sha256.txt <<'SHA256'
          fd564943b7e86727aa7a2d8db7120e30a71ddeaaa65726af6c407f422761a421  dist/go-hipster-go-chatgpt-plugin.zip
          7f8df04a4dffa1bb195e2de21fda7c314dbedb1455417e8030fa9f2daf5646dd  dist/go-hipster-go-claude-plugin.zip
          621b973f1a3f9dcead39e2ed03f824c3cd2cbdf38dc6d1f2c6e7751b45f16f73  dist/go-hipster-go-claude-skill.zip
          50a78b479a065ba97cc39a07a3445eb08f170a67a52f84faa801243ef6d6aa76  dist/go-hipster-go-gemini-app-skill.zip
          SHA256
          sha256sum -c /tmp/approved-sha256.txt
      - name: Publish approved new version (never overwrite)
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release tag already exists, refusing overwrite.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/go-hipster-go-gemini-app-skill.zip \
            dist/go-hipster-go-claude-skill.zip \
            dist/go-hipster-go-claude-plugin.zip \
            dist/go-hipster-go-chatgpt-plugin.zip \
            --target "$EXPECTED_SOURCE" \
            --title 'Go, Hipster, Go! 3.11.6' \
            --notes 'Approved 3.11.6 canonical skill packages. Includes region-first discovery, the unified RC9 checkpoint, and Clean ≠ Mainstream recording-quality clarification. Music-service publishing is separately authorized per host. Public ChatGPT catalog submission is not part of this GitHub release.' \
            --latest
          gh release view "$RELEASE_TAG" --json url,assets
